<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚌 버스 마피아: 시크릿 시트</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; font-size: 24px; margin-bottom: 20px; }
        input { width: 80%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-size: 16px; }
        button { width: 85%; padding: 12px; background-color: #ffcc00; color: #000; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #e6b800; }
        #status { margin-top: 15px; color: #888; font-size: 14px; }
        #chatBox { background: #2d2d2d; height: 150px; overflow-y: auto; text-align: left; padding: 10px; margin-top: 20px; border-radius: 5px; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚌 BUS MAFIA</h1>
    <p>베트남 나트랑 버스 실시간 대기실</p>
    
    <input type="text" id="nameInput" placeholder="닉네임을 입력하세요">
    <button onclick="joinGame()">게임 입장하기</button>
    
    <div id="status">서버 연결 중...</div>
    
    <div id="chatBox">접속자 현황 및 알림이 여기에 뜹니다.</div>
</div>

<script>
    // 🚨 [핵심] 상대 경로인 "/gameHub"를 적어주면, 내 컴퓨터든 Render 클라우드 주소든 알아서 주소를 찾아 붙습니다!
    const connection = new signalR.HubConnectionBuilder()
        .withUrl("/gameHub")
        .withAutomaticReconnect()
        .build();

    // 서버가 나한테 "누구 들어왔다!" 하고 방송(알림) 보낼 때 받는 통로
    connection.on("ReceiveMessage", (user, message) => {
        const chatBox = document.getElementById("chatBox");
        chatBox.innerHTML += `<div><strong>${user}</strong>: ${message}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight; // 스크롤 맨 아래로
    });

    // 실시간 서버 연결 시작
    connection.start()
        .then(() => {
            document.getElementById("status").innerText = "🟢 서버 연결 완료! 입장 가능";
            document.getElementById("status").style.color = "#00ffcc";
        })
        .catch(err => {
            document.getElementById("status").innerText = "🔴 연결 실패. 새로고침 하세요.";
            document.getElementById("status").style.color = "#ff3333";
            console.error(err);
        });

    // 입장 버튼 눌렀을 때 작동하는 함수
    function joinGame() {
        const name = document.getElementById("nameInput").value.trim();
        if (!name) {
            alert("닉네임을 적어주세요!");
            return;
        }
        
        // C# GameHub.cs에 있는 "JoinRoom" 메서드를 호출하면서 내 닉네임을 보냄
        connection.invoke("JoinRoom", name)
            .then(() => {
                document.getElementById("nameInput").disabled = true;
                document.getElementById("status").innerText = `🎮 [${name}]으로 대기 중...`;
            })
            .catch(err => console.error(err));
    }
</script>

</body>
</html>
